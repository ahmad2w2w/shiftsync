<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — ShiftSync</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; background: #F1F5F9; color: #0F172A; text-align: center; padding: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: #64748B; margin: 0 0 1.5rem; font-size: 0.875rem; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 0.75rem; padding: 0.625rem 1.25rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>Je bent offline</h1>
    <p>ShiftSync heeft een internetverbinding nodig. Controleer je netwerk en probeer opnieuw.</p>
    <button onclick="location.reload()">Opnieuw proberen</button>
  </div>
</body>
</html>
